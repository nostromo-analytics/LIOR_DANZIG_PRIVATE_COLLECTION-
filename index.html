const PW = DATA.pw, PH = DATA.ph, PAGES = DATA.pages, NP = PAGES.length;

function imgUrl(hash){
  if (DATA.local[hash]) return DATA.local[hash];
  return DATA.base + hash + '_m';
}

/* ---------- page rendering ---------- */
function buildPage(idx){           /* idx = 1..NP ; 0 or >NP = blank */
  const d = document.createElement('div');
  d.className = 'page';
  d.style.width = PW + 'px';
  d.style.height = PH + 'px';
  if (idx < 1 || idx > NP) { d.style.background = '#fff'; return d; }
  const els = PAGES[idx-1].slice().sort((a,b)=>a.z-b.z);
  for (const e of els){
    const [x,y,w,h] = e.b;
    const n = document.createElement('div');
    n.style.left = x+'px'; n.style.top = y+'px';
    n.style.width = w+'px'; n.style.height = h+'px';
    if (e.r) n.style.transform = 'rotate('+e.r+'deg)';
    if (e.o !== undefined && e.o !== 1) n.style.opacity = e.o;
    if (e.t === 'i'){
      n.className = 'el img';
      const [cl,ct,cw,ch] = e.c;
      const fullW = w / (cw || 1), fullH = h / (ch || 1);
      const im = document.createElement('img');
      im.loading = 'lazy'; im.decoding = 'async'; im.alt = '';
      im.src = imgUrl(e.s);
      const bare = DATA.base + e.s;
      im.onerror = function(){ if(!this.dataset.f){ this.dataset.f=1; this.src = bare; }
                               else if(this.dataset.f=='1'){ this.dataset.f='2'; this.src = bare+'_s'; } };
      im.style.width = fullW+'px'; im.style.height = fullH+'px';
      im.style.left = (-cl*fullW)+'px'; im.style.top = (-ct*fullH)+'px';
      n.appendChild(im);
    } else {
      n.className = 'el txt';
      n.style.textAlign = e.al || 'left';
      if (e.dir) n.style.direction = e.dir;
      for (const s of e.n){
        const sp = document.createElement('span');
        sp.textContent = s.x;
        sp.style.fontFamily = "'"+s.f+"', Georgia, 'Times New Roman', serif";
        sp.style.fontSize = s.fs+'px';
        sp.style.color = s.c;
        sp.style.lineHeight = (s.lh||1.4);
        if (s.tt && s.tt!=='none') sp.style.textTransform = s.tt;
        n.appendChild(sp);
      }
    }
    d.appendChild(n);
  }
  return d;
}

const cache = new Map();
function page(idx){
  if (!cache.has(idx)) cache.set(idx, buildPage(idx));
  return cache.get(idx);
}
function put(slot, idx){
  slot.textContent = '';
  if (idx >= 1 && idx <= NP){
    slot.style.visibility = 'visible';
    slot.appendChild(page(idx).cloneNode(true));
  } else {
    slot.style.visibility = 'hidden';
  }
}

/* ---------- layout ---------- */
const stage = document.getElementById('stage');
const vp = document.getElementById('viewport');
const book = document.getElementById('book');
const slotL = document.getElementById('slotL'), slotR = document.getElementById('slotR');
const leafwrap = document.getElementById('leafwrap'), leaf = document.getElementById('leaf');
const faceF = document.getElementById('faceF'), faceB = document.getElementById('faceB');

let spread = true;         /* two pages side by side */
let cur = 1;               /* leftmost page currently shown (spread: even, or 1 for cover) */
let busy = false;

function spreadOf(p){ return p<=1 ? 0 : Math.floor(p/2); }
function leftPageOf(s){ return s===0 ? 0 : s*2; }
function rightPageOf(s){ return s===0 ? 1 : s*2+1; }
const LAST_SPREAD = spreadOf(NP);
let sIdx = 0;              /* spread index */
let pIdx = 1;              /* single-page index */

function layout(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const wasSpread = spread;
  spread = (sw / sh) > (PW*2.05) / PH * 0.62 && sw > 720;
  if (wasSpread !== spread){
    if (spread) sIdx = spreadOf(pIdx);        /* single -> spread */
    else pIdx = rightPageOf(sIdx) <= NP ? rightPageOf(sIdx) : leftPageOf(sIdx);
  }
  const bw = spread ? PW*2 : PW;
  book.style.width = bw+'px'; book.style.height = PH+'px';
  slotL.style.width = PW+'px'; slotL.style.height = PH+'px'; slotL.style.left = '0px';
  slotR.style.width = PW+'px'; slotR.style.height = PH+'px';
  slotR.style.left = (spread ? PW : 0)+'px';
  slotL.style.display = spread ? 'block' : 'none';
  leafwrap.style.width = PW+'px'; leafwrap.style.height = PH+'px';
  leafwrap.style.left = (spread ? PW : 0)+'px';
  const pad = spread ? 46 : 24;
  const k = Math.min((sw-pad*2)/bw, (sh-pad*2)/PH);
  vp.style.width = bw+'px'; vp.style.height = PH+'px';
  vp.style.transform = 'translate(-50%,-50%) scale('+k+')';
  render();
}

function render(){
  if (spread){
    put(slotL, leftPageOf(sIdx));
    put(slotR, rightPageOf(sIdx));
    addGutters();
  } else {
    put(slotR, pIdx);
  }
  updateChrome();
}
function addGutters(){
  if (leftPageOf(sIdx) < 1 || rightPageOf(sIdx) > NP) return;   /* no spine on lone cover/back */
  const a=document.createElement('div'); a.className='gutter l'; slotL.appendChild(a);
  const b=document.createElement('div'); b.className='gutter r'; slotR.appendChild(b);
}

function currentPage(){ return spread ? (rightPageOf(sIdx)<=NP ? rightPageOf(sIdx) : leftPageOf(sIdx)) : pIdx; }

function updateChrome(){
  const c = document.getElementById('counter');
  if (spread && leftPageOf(sIdx)>=1) c.textContent = leftPageOf(sIdx)+'–'+Math.min(rightPageOf(sIdx),NP)+' / '+NP;
  else c.textContent = currentPage()+' / '+NP;
  document.getElementById('slider').value = currentPage();
  document.getElementById('prev').disabled = spread ? sIdx===0 : pIdx===1;
  document.getElementById('next').disabled = spread ? sIdx>=LAST_SPREAD : pIdx>=NP;
}

/* ---------- flipping ---------- */
function setFace(el, idx, mirror){
  el.textContent = '';
  const p = page(idx).cloneNode(true);
  el.appendChild(p);
  const sh = document.createElement('div');
  sh.className = 'shade';
  el.appendChild(sh);
  el.dataset.shade = '';
}
const DUR = 720;

function turn(dir){                 /* dir: +1 next, -1 prev */
  if (busy) return;
  if (spread) return turnSpread(dir);
  return turnSingle(dir);
}

function turnSpread(dir){
  const target = sIdx + dir;
  if (target < 0 || target > LAST_SPREAD) return;
  busy = true;
  leafwrap.style.display = 'block';
  let from, to;
  if (dir > 0){
    setFace(faceF, rightPageOf(sIdx));
    setFace(faceB, leftPageOf(target));
    put(slotL, leftPageOf(sIdx));
    put(slotR, rightPageOf(target));
    from = 0; to = -180;
  } else {
    setFace(faceF, rightPageOf(target));
    setFace(faceB, leftPageOf(sIdx));
    put(slotL, leftPageOf(target));
    put(slotR, rightPageOf(sIdx));
    from = -180; to = 0;
  }
  animate(from, to, ()=>{ sIdx = target; leafwrap.style.display='none'; render(); busy=false; });
}

function turnSingle(dir){
  const target = pIdx + dir;
  if (target < 1 || target > NP) return;
  busy = true;
  leafwrap.style.display = 'block';
  let from, to;
  if (dir > 0){
    setFace(faceF, pIdx);
    setFace(faceB, target);
    put(slotR, target);
    from = 0; to = -180;
  } else {
    setFace(faceF, target);
    setFace(faceB, pIdx);
    put(slotR, target);
    from = -180; to = 0;
  }
  animate(from, to, ()=>{ pIdx = target; leafwrap.style.display='none'; render(); busy=false; });
}

function animate(from, to, done){
  const t0 = performance.now();
  leaf.style.transform = 'rotateY('+from+'deg)';
  function frame(t){
    let u = Math.min(1,(t-t0)/DUR);
    const e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;   /* easeInOutQuad */
    const a = from + (to-from)*e;
    leaf.style.transform = 'rotateY('+a+'deg)';
    const lift = Math.sin(e*Math.PI);
    faceF.style.filter = 'brightness('+(1-0.20*lift)+')';
    faceB.style.filter = 'brightness('+(1-0.20*lift)+')';
    leaf.style.boxShadow = '0 '+(12+34*lift)+'px '+(28+52*lift)+'px rgba(0,0,0,'+(0.18+0.28*lift)+')';
    if (u<1) requestAnimationFrame(frame);
    else { faceF.style.filter=''; faceB.style.filter=''; leaf.style.boxShadow=''; done(); }
  }
  requestAnimationFrame(frame);
}

function goTo(p){
  p = Math.max(1, Math.min(NP, p|0));
  if (spread){ sIdx = spreadOf(p); } else { pIdx = p; }
  render();
}

/* ---------- overview grid ---------- */
const grid = document.getElementById('grid'), gridinner = document.getElementById('gridinner');
let gridBuilt = false;
function buildGrid(){
  if (gridBuilt) return; gridBuilt = true;
  for (let i=1;i<=NP;i++){
    const t = document.createElement('div'); t.className='thumb';
    const box = document.createElement('div'); box.className='box';
    const inner = document.createElement('div');
    inner.appendChild(page(i).cloneNode(true));
    box.appendChild(inner);
    const lab = document.createElement('span'); lab.textContent = i;
    t.appendChild(box); t.appendChild(lab);
    t.onclick = ()=>{ grid.classList.remove('open'); goTo(i); };
    gridinner.appendChild(t);
  }
  requestAnimationFrame(scaleThumbs);
}
function scaleThumbs(){
  gridinner.querySelectorAll('.box').forEach(b=>{
    const k = b.clientWidth / PW;
    b.firstChild.style.transform = 'scale('+k+')';
    b.firstChild.style.width = PW+'px';
    b.firstChild.style.height = PH+'px';
  });
}

/* ---------- wiring ---------- */
document.getElementById('next').onclick = ()=>turn(1);
document.getElementById('prev').onclick = ()=>turn(-1);
document.getElementById('slider').max = NP;
document.getElementById('slider').oninput = e=>goTo(+e.target.value);
document.getElementById('gridbtn').onclick = ()=>{ buildGrid(); grid.classList.add('open'); requestAnimationFrame(scaleThumbs); };
document.getElementById('gridclose').onclick = ()=>grid.classList.remove('open');
document.getElementById('fsbtn').onclick = ()=>{
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
addEventListener('keydown', e=>{
  if (e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { e.preventDefault(); turn(1); }
  if (e.key==='ArrowLeft'  || e.key==='PageUp')  { e.preventDefault(); turn(-1); }
  if (e.key==='Escape') grid.classList.remove('open');
});
stage.addEventListener('click', e=>{
  if (e.target.closest('#bar') || e.target.closest('.nav') || e.target.closest('#grid')) return;
  const r = stage.getBoundingClientRect();
  turn(e.clientX - r.left > r.width/2 ? 1 : -1);
});
let tx=null;
stage.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e=>{
  if (tx===null) return;
  const dx = e.changedTouches[0].clientX - tx; tx=null;
  if (Math.abs(dx) > 45) turn(dx < 0 ? 1 : -1);
});
addEventListener('resize', ()=>{ layout(); if (gridBuilt) scaleThumbs(); });
layout();
leafwrap.style.display='none';

/* warm up neighbouring images */
setTimeout(()=>{ for(let i=1;i<=NP;i++) page(i); }, 400);
</script>
